<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 p-8 rounded-[2.5rem] w-full max-w-md border border-slate-700 shadow-2xl text-center">
        <h2 class="text-3xl font-black mb-6">AI ASİSTAN</h2>

        <button id="mainBtn" onclick="toggleSystem()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-6 rounded-3xl font-bold text-xl transition-all mb-4">
            SİSTEMİ BAŞLAT
        </button>

        <button onclick="downloadScript()" class="w-full bg-slate-700 text-slate-300 py-3 rounded-2xl font-medium text-sm border border-slate-600 mb-8">
            📄 DERS NOTLARINI İNDİR (.TXT)
        </button>

        <div class="space-y-4 text-left">
            <div class="bg-slate-900/50 p-4 rounded-2xl border-l-4 border-sky-400">
                <small class="text-sky-400 font-bold uppercase text-[10px]">Hoca (TR)</small>
                <p id="tr_p" class="mt-1 text-slate-200 italic">Dinleniyor...</p>
            </div>
            <div class="bg-slate-900/50 p-4 rounded-2xl border-l-4 border-emerald-400">
                <small class="text-emerald-400 font-bold uppercase text-[10px]">Çeviri (EN)</small>
                <p id="en_p" class="mt-1 text-slate-100 font-semibold">Burada görünecek.</p>
            </div>
        </div>
    </div>

    <script>
        let isRunning = false;
        let recognition;
        let fullScript = "";
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function toggleSystem() {
            if (!isRunning) startSystem();
            else stopSystem();
        }

        function startSystem() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'tr-TR';
            recognition.continuous = true;

            recognition.onresult = async (event) => {
                const text = event.results[event.results.length - 1][0].transcript;
                document.getElementById('tr_p').innerText = text;
                
                // Vercel API'ye gönder
                const response = await fetch('/process', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({text: text})
                });
                const data = await response.json();
                
                document.getElementById('en_p').innerText = data.en;
                fullScript += `TR: ${text}\nEN: ${data.en}\n\n`;
                if (data.audio) playAudio(data.audio);
            };

            recognition.start();
            isRunning = true;
            document.getElementById('mainBtn').innerText = "🛑 DURDUR";
            document.getElementById('mainBtn').className = "w-full bg-red-500 text-white py-6 rounded-3xl font-bold text-xl mb-4";
        }

        function stopSystem() {
            recognition.stop();
            isRunning = false;
            document.getElementById('mainBtn').innerText = "SİSTEMİ BAŞLAT";
            document.getElementById('mainBtn').className = "w-full bg-emerald-500 text-white py-6 rounded-3xl font-bold text-xl mb-4";
        }

        function playAudio(base64) {
            const binary = window.atob(base64);
            const buffer = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) buffer[i] = binary.charCodeAt(i);
            audioCtx.decodeAudioData(buffer.buffer, (decoded) => {
                const source = audioCtx.createBufferSource();
                source.buffer = decoded;
                source.connect(audioCtx.destination);
                source.start(0);
            });
        }

        function downloadScript() {
            const blob = new Blob([fullScript], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Ders_Notu.txt`;
            a.click();
        }
    </script>
</body>
</html>
