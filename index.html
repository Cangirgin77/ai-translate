<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Turbo Assistance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-[#020817] text-white selection:bg-cyan-500/30 min-h-screen">

    <nav class="border-b border-white/10 backdrop-blur-md fixed top-0 w-full z-50 bg-[#020817]/80">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            
            <a href="#" class="flex items-center gap-2 group">
                <span class="text-2xl font-black bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent group-hover:from-blue-300 group-hover:to-cyan-300 transition-all cursor-pointer uppercase">
                    AI Turbo Assistance
                </span>
            </a>

            <div class="hidden md:flex items-center gap-8">
                <a href="#" class="text-sm font-medium text-gray-400 hover:text-white transition-colors">Özellikler</a>
                <a href="#" class="text-sm font-medium text-gray-400 hover:text-white transition-colors">Çözümler</a>
                <a href="#" class="text-sm font-medium text-gray-400 hover:text-white transition-colors">Kullanım Rehberi</a>
            </div>

            <div class="flex items-center gap-4">
                <button class="hidden sm:flex items-center gap-2 px-4 py-2 text-sm font-medium text-gray-300 border border-white/10 rounded-lg hover:bg-white/5 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" x2="22" y1="12" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                    English us
                </button>
                <button class="px-5 py-2 text-sm font-bold text-white bg-gradient-to-r from-blue-600 to-cyan-600 rounded-lg hover:from-blue-500 hover:to-cyan-500 shadow-lg shadow-blue-500/20 transition-all">
                    Launch App
                </button>
            </div>
        </div>
    </nav>
    <main class="pt-32 pb-16 px-6 relative overflow-hidden">
        
        <div class="absolute top-20 left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-blue-500/10 rounded-full blur-[100px] -z-10 pointer-events-none"></div>

        <div class="max-w-4xl mx-auto text-center mt-12 md:mt-20">
            
            <h1 class="text-5xl md:text-7xl font-black tracking-tight mb-8 leading-[1.1]">
                <span class="italic text-white">Akıllı Çeviri,</span>
                <br />
                <span class="bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                    Kesintisiz Eğitim.
                </span>
            </h1>

            <p class="text-lg md:text-xl text-gray-400 mb-10 max-w-2xl mx-auto leading-relaxed">
                Gelişmiş yapay zeka ile dil bariyerlerini yıkan öğrenci dostu asistan.
            </p>

            <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <button class="w-full sm:w-auto px-8 py-4 bg-cyan-500 hover:bg-cyan-400 text-black font-bold rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-cyan-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    Start Now
                </button>
                
                <button class="w-full sm:w-auto px-8 py-4 bg-white/5 hover:bg-white/10 text-white font-semibold rounded-xl border border-white/10 transition-all flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                    User Guide
                </button>
            </div>

        </div>
    </main>
    </body>
</html>
